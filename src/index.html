<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Diego — Desarrollador full-stack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio de Diego, desarrollador full-stack en Bogotá. Proyectos de software, videojuegos y diseño de interfaces."
    />
    <meta name="theme-color" content="#1a1b26" />
    <script>
      (function () {
        var root = document.documentElement;
        var stored = null;

        try {
          stored = window.localStorage.getItem('portfolio-theme');
        } catch (error) {
          // El almacenamiento puede estar bloqueado; se usa la preferencia del sistema.
        }

        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';

        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;

        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', theme === 'light' ? '#e1e2e7' : '#1a1b26');
        }
      })();
    </script>
    <meta property="og:title" content="Diego — Desarrollador full-stack" />
    <meta
      property="og:description"
      content="Proyectos de software, videojuegos y diseño de interfaces."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
